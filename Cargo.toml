[package]
name = "ferrosian"
version = "0.1.0"
edition = "2024"

[profile.test]
opt-level = 3

[profile.release]
debug = true

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
anyhow = "1.0.104"
derive_more = { version = "2.1.1", features = [
	"add",
    "not",
    "add_assign",
	"display"
]}
thiserror = "2.0"
